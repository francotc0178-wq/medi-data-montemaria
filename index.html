<script>
  async function generarYEnviarPDF() {
    const btn = document.querySelector('button[type="button"]') || document.querySelector('button');
    
    // Captura los valores de tu formulario original
    const email = document.getElementById('email')?.value.trim();
    const nombre = document.getElementById('nombre')?.value.trim() || 'Paciente';
    const rut = document.getElementById('rut')?.value.trim() || 'Sin RUT';
    const observaciones = document.getElementById('observaciones')?.value.trim() || 'Sin observaciones';

    if (!email) {
      alert("Por favor ingresa un correo electrónico.");
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerText = "Enviando...";
    }

    try {
      const response = await fetch('https://medi-data-montemaria.onrender.com/api/enviar-pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: email,
          nombre: nombre,
          rut: rut,
          datos: observaciones
        })
      });

      const result = await response.json();

      if (response.ok && result.success) {
        alert("¡Éxito! La ficha médica ha sido generada y enviada a tu correo.");
      } else {
        alert("Error: " + (result.error || "No se pudo enviar el correo."));
      }
    } catch (err) {
      alert("Error de conexión: " + err.message);
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerText = "Enviar Ficha Médica al Correo";
      }
    }
  }
</script>
