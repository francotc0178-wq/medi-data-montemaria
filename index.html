<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediData MonteMaría - Ficha Médica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen py-10 px-4">

  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg border border-slate-200 p-6 md:p-8">
    
    <header class="border-b-2 border-blue-600 pb-4 mb-6">
      <h1 class="text-2xl font-bold text-blue-900">MediData MonteMaría</h1>
      <p class="text-slate-500 text-xs">Sistema Integrado de Registro de Fichas Médicas</p>
    </header>

    <form id="form-ficha" class="space-y-6" onsubmit="event.preventDefault(); enviarFormulario();">
      
      <div>
        <h2 class="text-lg font-semibold text-blue-800 border-b border-slate-200 pb-2 mb-4">Identificación del Paciente</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo *</label>
            <input type="text" id="nombre" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej: Juan Pérez">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">RUT / Identificación *</label>
            <input type="text" id="rut" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej: 12.345.678-K">
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico (Para envío de PDF) *</label>
            <input type="email" id="email" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="correo@ejemplo.com">
          </div>
        </div>
      </div>

      <div>
        <h2 class="text-lg font-semibold text-blue-800 border-b border-slate-200 pb-2 mb-4">Antecedentes Médicos</h2>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Observaciones / Antecedentes</label>
          <textarea id="datos" rows="3" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Detalles de salud del paciente..."></textarea>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-200 text-center">
        <button type="submit" id="btn-enviar" class="w-full md:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition">
          Enviar Ficha Médica al Correo
        </button>
      </div>

    </form>
  </div>

  <script>
    async function enviarFormulario() {
      const btn = document.getElementById('btn-enviar');
      const email = document.getElementById('email').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const rut = document.getElementById('rut').value.trim();
      const datos = document.getElementById('datos').value.trim();

      if (!email) {
        alert("Por favor ingresa un correo electrónico.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Enviando...";

      try {
        const response = await fetch('https://medi-data-montemaria.onrender.com/api/enviar-pdf', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email,
            nombre: nombre,
            rut: rut,
            datos: datos
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert("¡Éxito! La ficha médica ha sido generada y enviada a tu correo.");
        } else {
          alert("Atención: " + (result.error || "El servidor no pudo procesar la solicitud."));
        }
      } catch (err) {
        alert("Error de conexión con el servidor: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Enviar Ficha Médica al Correo";
      }
    }
  </script>

</body>
</html>
