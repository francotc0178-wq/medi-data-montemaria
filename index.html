<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediData MonteMaría - Ficha Médica</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen py-10 px-4">

  <div id="ficha-medica" class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-200 p-6 md:p-8">
    
    <!-- ENCABEZADO CON LOGO DEL LICEO -->
    <header class="flex flex-col md:flex-row items-center justify-between border-b-2 border-blue-600 pb-4 mb-6 gap-4">
      <div class="flex items-center gap-4">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSVsXEPoHj4WimfZL9MAqu41KfvuQ1cdJx7fPN3xj-qyA&s=10" alt="Logo Liceo MonteMaría" class="h-20 w-auto object-contain">
        <div>
          <h1 class="text-2xl font-bold text-blue-900">MediData MonteMaría</h1>
          <p class="text-slate-500 text-xs">Sistema Integrado de Registro y Gestión de Fichas Médicas</p>
        </div>
      </div>
      <div class="text-right text-xs text-slate-500 hidden md:block">
        <p>Liceo MonteMaría</p>
        <p>Departamento de Salud Escolar</p>
      </div>
    </header>

    <form id="form-ficha" class="space-y-6" onsubmit="event.preventDefault(); generarYEnviarPDF();">
      
      <!-- SECCIÓN 1: DATOS DEL PACIENTE -->
      <div>
        <h2 class="text-lg font-semibold text-blue-800 border-b border-slate-200 pb-2 mb-4">1. Identificación del Paciente</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo *</label>
            <input type="text" id="nombre" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej: Juan Pérez">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">RUT / Identificación *</label>
            <input type="text" id="rut" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej: 12.345.678-K">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Curso / Nivel</label>
            <input type="text" id="curso" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Ej: 1° Medio A">
          </div>

          <div class="md:col-span-3">
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico (Para envío de PDF) *</label>
            <input type="email" id="email" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="correo@ejemplo.com">
          </div>
        </div>
      </div>

      <!-- SECCIÓN 2: ANTECEDENTES Y SALUD -->
      <div>
        <h2 class="text-lg font-semibold text-blue-800 border-b border-slate-200 pb-2 mb-4">2. Antecedentes Médicos</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Alergias Conocidas</label>
            <input type="text" id="alergias" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Medicamentos, alimentos, etc.">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Medicamentos de Uso Habitual</label>
            <input type="text" id="medicamentos" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Especifique dosis si aplica">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Diagnóstico / Observaciones Clínicas</label>
          <textarea id="observaciones" rows="4" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Detalles de la atención o condición médica..."></textarea>
        </div>
      </div>

      <!-- BOTONES DE ACCIÓN (IMPRIMIR / GUARDAR LOCAL / ENVIAR) -->
      <div class="pt-4 border-t border-slate-200 flex flex-col sm:flex-row justify-end gap-3 print:hidden">
        <button type="button" onclick="window.print()" class="px-5 py-2.5 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded-lg shadow-sm transition">
          🖨️ Imprimir
        </button>

        <button type="submit" id="btn-enviar" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition">
          ✉️ Enviar al Correo y Guardar
        </button>
      </div>

    </form>
  </div>

  <script>
    function validarRut(rut) {
      return rut && rut.trim().length > 7;
    }

    async function generarYEnviarPDF() {
      const btn = document.getElementById('btn-enviar');
      const email = document.getElementById('email')?.value.trim();
      const nombre = document.getElementById('nombre')?.value.trim() || 'Paciente';
      const rut = document.getElementById('rut')?.value.trim() || 'Sin RUT';
      const curso = document.getElementById('curso')?.value.trim() || 'No especificado';
      const alergias = document.getElementById('alergias')?.value.trim() || 'Ninguna';
      const medicamentos = document.getElementById('medicamentos')?.value.trim() || 'Ninguno';
      const observaciones = document.getElementById('observaciones')?.value.trim() || 'Sin observaciones adicionales';

      if (!email) {
        alert("Por favor ingresa un correo electrónico válido.");
        return;
      }

      if (!validarRut(rut)) {
        alert("Por favor ingresa un RUT válido.");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Enviando al Servidor...";

      const resumenDatos = `Curso: ${curso} | Alergias: ${alergias} | Medicamentos: ${medicamentos} | Obs: ${observaciones}`;

      try {
        const response = await fetch('https://medi-data-montemaria.onrender.com/api/enviar-pdf', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            nombre: nombre,
            rut: rut,
            datos: resumenDatos
          })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert("¡Éxito! La ficha se guardó en el servidor y se envió el correo con el PDF adjunto.");
        } else {
          alert("Atención: " + (result.error || "No se pudo procesar el envío."));
        }
      } catch (err) {
        alert("Error de conexión con el servidor: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "✉️ Enviar al Correo y Guardar";
      }
    }
  </script>

</body>
</html>
