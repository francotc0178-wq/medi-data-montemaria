<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediData MonteMaría - Ficha Médica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería para la generación de PDF en el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">

  <div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md" id="ficha-medica-container">
    <h1 class="text-2xl font-bold text-center text-blue-800 mb-6">Ficha Médica MediData MonteMaría</h1>

    <form id="fichaForm" onsubmit="return false;" class="space-y-4">
      <div>
        <label class="block font-medium text-gray-700">RUT Paciente:</label>
        <input type="text" id="rut" class="w-full border rounded p-2 focus:ring focus:ring-blue-300" placeholder="12345678-9" required />
      </div>

      <div>
        <label class="block font-medium text-gray-700">Nombre Completo:</label>
        <input type="text" id="nombre" class="w-full border rounded p-2 focus:ring focus:ring-blue-300" placeholder="Nombre del paciente" required />
      </div>

      <div>
        <label class="block font-medium text-gray-700">Correo Electrónico:</label>
        <input type="email" id="email" class="w-full border rounded p-2 focus:ring focus:ring-blue-300" placeholder="ejemplo@correo.com" required />
      </div>

      <div>
        <label class="block font-medium text-gray-700">Diagnóstico / Observaciones:</label>
        <textarea id="observaciones" rows="4" class="w-full border rounded p-2 focus:ring focus:ring-blue-300" placeholder="Detalles de la ficha médica..."></textarea>
      </div>

      <div class="flex gap-4 pt-4">
        <button type="button" onclick="generarYEnviarPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
          Enviar Ficha Médica al Correo
        </button>
      </div>
    </form>
  </div>

<script>
// Validar RUT básico
function validarRut(rut) {
  return rut && rut.trim().length > 7;
}

// === GENERAR Y ENVIAR PDF ===
async function generarYEnviarPDF() {
  const emailInput = document.getElementById('email');
  const rutInput = document.getElementById('rut');

  const email = emailInput ? emailInput.value : '';
  const rut = rutInput ? rutInput.value : 'Paciente';

  if (!email) {
    alert("Por favor ingresa un correo electrónico válido antes de enviar.");
    return;
  }

  if (!validarRut(rut)) {
    alert("Por favor ingresa un RUT válido.");
    return;
  }

  const element = document.getElementById('ficha-medica-container');

  try {
    // Configuración liviana de PDF (compresión activada)
    const opt = {
      margin:       [0.2, 0.2, 0.2, 0.2],
      filename:     `Ficha_Medica_${rut}.pdf`,
      image:        { type: 'jpeg', quality: 0.6 },
      html2canvas:  { scale: 1.2, useCORS: true, logging: false, scrollY: 0 },
      jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait', compress: true },
      pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
    };

    // Generar Base64 del PDF
    const pdfBase64 = await html2pdf().set(opt).from(element).outputPdf('datauristring');

    // Enviar a la URL exacta del backend en Render
    const response = await fetch('https://medi-data-montemaria.onrender.com/api/enviar-pdf', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        email: email,
        pdfData: pdfBase64
      })
    });

    const data = await response.json();

    if (data.success) {
      alert("¡Ficha médica enviada correctamente a tu correo!");
    } else {
      alert("Error en el servidor: " + data.error);
    }

  } catch (err) {
    console.error("Error al procesar el envío:", err);
    alert("Error al generar o enviar el PDF: " + err.message);
  }
}
</script>
</body>
</html>
